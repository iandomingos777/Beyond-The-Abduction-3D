<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG - Jogo 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
    <link rel="stylesheet" href="./src/menu/menuStyles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
        }

        #game-wrapper {
            position: relative;
        }

        canvas {
            border: 1px solid #333;
            display: block;
        }

        /* Victory Screen Overlay */
        #victory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        #victory-overlay.show {
            display: flex;
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .victory-message {
            font-family: 'Courier New', monospace;
            font-size: 4rem;
            font-weight: bold;
            color: #00ff41;
            text-align: center;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41,
                3px 3px 0 rgba(0, 0, 0, 0.8);
            animation: glowPulse 2s ease-in-out infinite, slideIn 1.5s ease-out;
            letter-spacing: 0.1em;
        }

        @keyframes glowPulse {
            0%, 100% { 
                text-shadow: 
                    0 0 10px #00ff41,
                    0 0 20px #00ff41,
                    0 0 30px #00ff41,
                    3px 3px 0 rgba(0, 0, 0, 0.8);
            }
            50% { 
                text-shadow: 
                    0 0 20px #00ff41,
                    0 0 40px #00ff41,
                    0 0 60px #00ff41,
                    3px 3px 0 rgba(0, 0, 0, 0.8);
            }
        }

        @keyframes slideIn {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .victory-subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            color: #00ff41;
            margin-top: 20px;
            opacity: 0;
            animation: fadeInSub 1s ease-in 1.5s forwards;
        }

        @keyframes fadeInSub {
            to { opacity: 1; }
        }
    </style>
</head>

<body>
    <div id="game-wrapper">
        <canvas id="glcanvas1" width="1280" height="720"></canvas>
        <div id="menu-overlay"></div>
        <div id="victory-overlay">
            <div class="victory-message">GABRIELZITO<br>ESCAPOU!</div>
            <div class="victory-subtitle">Pressione Enter para voltar ao menu</div>
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
